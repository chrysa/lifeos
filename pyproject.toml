[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifeos"
version = "0.1.0"
description = "Floating AI assistant multi-OS — system monitoring, messaging, AI and external service integrations"
authors = [{ name = "chrysa", email = "greau.anthony@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
keywords = [
    "ai",
    "assistant",
    "overlay",
    "system-monitoring",
    "notion",
    "discord",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "psutil>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
discord = ["discord.py>=2.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "pytest-mock>=3.14",
]

[project.scripts]
lifeos = "lifeos.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["lifeos"]

[tool.ruff]
# py313 (not py314): ruff format <=0.15.15 strips multi-except parens under py314 — restore when fixed upstream
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "C4", "T20", "N", "RUF", "C901", "PERF203", "PERF401", "PLR0402", "PLR0911", "PLR0912", "PLR0915", "PLR1714", "PLR1730", "PLR5501"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["I", "S", "T20"]
"tests/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["scripts/"]

[[tool.mypy.overrides]]
module = ["lifeos.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=lifeos --cov-report=xml --cov-report=term-missing --cov-fail-under=85"
