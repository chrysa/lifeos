docs_dir: docs
markdown_extensions:
- admonition
- pymdownx.highlight
- pymdownx.superfences
- tables
repo_name: lifeos
repo_url: https://github.com/chrysa/lifeos
site_description: "Floating desktop AI assistant \u2014 PySide6 overlay, plugin system,\
  \ multi-provider"
site_name: "lifeos \u2014 Documentation"
site_url: https://chrysa.github.io/lifeos/
strict: true
theme:
  features:
  - navigation.expand
  - navigation.sections
  - search.highlight
  - search.suggest
  - toc.integrate
  name: material
  palette:
  - accent: purple
    media: '(prefers-color-scheme: dark)'
    primary: deep purple
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  - accent: purple
    media: '(prefers-color-scheme: light)'
    primary: deep purple
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
