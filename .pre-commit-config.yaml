default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
exclude: ^\.claude/
repos:
- repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.1.1-99
  hooks:
  - id: makefile-check
  - id: yaml-sorter
    exclude: ^(\.github/ISSUE_TEMPLATE/|\.github/workflows/|GitVersion\.yml)
  - id: json-sorter
  - id: env-file-check
  - id: debugger-detection
  - id: python-print-detection
  - id: python-logger-detection
  - id: no-bare-except
  - id: adr-gate
  - id: python-pprint-detection
  - id: no-sync-in-async
  - id: regression-gate
    stages:
    - pre-push
  - id: env-example-sync
  - id: python-unreachable-code
  - id: no-hardcoded-localhost
    exclude: tests?/|\.test\.|\.spec\.
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  - id: python-no-unittest-import
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: detect-private-key
  - id: no-commit-to-branch
  - id: check-yaml
    args:
    - --allow-multiple-documents
    exclude: ^\.github/ISSUE_TEMPLATE/
  - id: check-json
  - id: check-toml
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: mixed-line-ending
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.0
  hooks:
  - id: mypy
    additional_dependencies:
    - pydantic>=2.13.4
    - pydantic-settings>=2.14.2
    - httpx>=0.28.1
    - psutil>=7.2.2
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.0
  hooks:
  - id: ruff
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/adrienverge/yamllint
  rev: v1.38.0
  hooks:
  - id: yamllint
    args:
    - --strict
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
    # `.claude/` holds managed copies distributed fleet-wide; this repo does not
    # author them, so it must not be gated on their markdown style.
    exclude: ^\.claude/
    args:
    - --disable
    - MD013
    - MD033
    - MD041
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf
    - revert
    - ci
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.15.4
  hooks:
  - id: guideline-check
