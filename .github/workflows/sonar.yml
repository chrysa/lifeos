---
name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    if: github.actor != 'dependabot[bot]'
    name: SonarCloud scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: SonarCloud scan
        uses: chrysa/github-actions/sonar-scan-python@v1.1.3
        with:
          python-version: "3.14"
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          project-key: chrysa_my-assistant
          organization: chrysa
          project-name: my-assistant
          sources: lifeos
          tests: tests
