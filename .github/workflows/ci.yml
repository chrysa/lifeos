"on":
  pull_request:
    branches:
    - main
    - master
  push:
    branches:
    - main
    - master
jobs:
  lint:
    name: Lint & pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -e ".[dev]"
    - name: Run pytest
      run: pytest --tb=short
name: CI
permissions:
  contents: read
