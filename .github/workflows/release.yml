on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - .github/**
  workflow_dispatch: null
jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.x
      - id: gitversion
        name: Determine version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      - name: Install git-cliff
        uses: taiki-e/install-action@3f99142a47f5f35fcd7322b74947248526d32622 # git-cliff
      - id: changelog
        name: Generate changelog
        run:
          "CURRENT_TAG=\"v${{ steps.gitversion.outputs.semVer }}\"\ngit cliff --output\
          \ CHANGELOG_RELEASE.md --tag \"$CURRENT_TAG\" 2>/dev/null || \\\n  git cliff\
          \ --unreleased --output CHANGELOG_RELEASE.md\necho \"version=$CURRENT_TAG\"\
          \ >> \"$GITHUB_OUTPUT\"\n"
      - name: Create tag
        run: 'git config user.name ''chrysa''

          git config user.email ''greau.anthony+chrysa@gmail.com''

          git tag "${{ steps.changelog.outputs.version }}" || echo "Tag already exists"

          git push origin "${{ steps.changelog.outputs.version }}" || echo "Tag push
          skipped"

          '
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: CHANGELOG_RELEASE.md
          name: Release ${{ steps.changelog.outputs.version }}
          tag_name: ${{ steps.changelog.outputs.version }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
name: Release
permissions:
  contents: write
  pull-requests: read
