---
name: Mutation Testing

# Weekly mutation score, computed by the shared mutmut 3 workflow.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      paths:
        description: "Comma-separated paths to mutate (default: lifeos)"
        required: false
        default: "lifeos"
      threshold:
        description: "Minimum mutation score (0-100)"
        required: false
        default: "70"

permissions:
  contents: read

jobs:
  mutation:
    uses: chrysa/github-actions/.github/workflows/mutation-testing.yml@v1.11.2
    with:
      paths: ${{ inputs.paths || 'lifeos' }}
      threshold: ${{ inputs.threshold || '70' }}
