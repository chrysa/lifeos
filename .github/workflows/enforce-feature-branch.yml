name: Enforce Feature Branch Policy

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  branch-policy:
    if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate PR source branch naming
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          branch="$HEAD_REF"
          pattern='^(feat|feature|fix|chore|docs|refactor|test|ci|build|perf|hotfix)/[a-z0-9._-]+$'
          if [[ ! "$branch" =~ $pattern ]]; then
            echo "Invalid branch name: $branch"
            echo "Expected: type/short-description (e.g. feature/add-auth-flow)"
            exit 1
          fi
