name: ops-sync
on:
  pull_request:
    types: [opened, reopened, closed]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Shortcut + Slack
        env:
          SCT: ${{ secrets.SHORTCUT_TOKEN }}
          SLT: ${{ secrets.SLACK_TOKEN }}
          CH:  ${{ secrets.SLACK_CHANNEL }}
          BR:  ${{ github.head_ref }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PRURL: ${{ github.event.pull_request.html_url }}
          PRNUM: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          SID=$(echo "$BR" | grep -oiE 'sc-[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          # état cible
          if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then TARGET="Done"; VERB="mergée"; 
          elif [ "$ACTION" = "closed" ]; then TARGET=""; VERB="fermée sans merge";
          else TARGET="In Review"; VERB="ouverte"; fi
          # move Shortcut
          if [ -n "$SID" ] && [ -n "$TARGET" ]; then
            WSID=$(curl -s -H "Shortcut-Token: $SCT" https://api.app.shortcut.com/api/v3/workflows \
              | python3 -c "import sys,json;print(next(s['id'] for w in json.load(sys.stdin) for s in w['states'] if s['name']=='$TARGET'))")
            curl -s -X PUT -H "Shortcut-Token: $SCT" -H "Content-Type: application/json" \
              -d "{\"workflow_state_id\":$WSID}" https://api.app.shortcut.com/api/v3/stories/$SID >/dev/null && echo "story sc-$SID -> $TARGET"
          fi
          # notify Slack
          MSG="PR #$PRNUM $VERB sur $REPO — $PRURL"
          [ -n "$SID" ] && MSG="$MSG (story sc-$SID)"
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLT" -H "Content-Type: application/json" \
            -d "{\"channel\":\"$CH\",\"text\":\"$MSG\"}" >/dev/null && echo "slack notifié"
